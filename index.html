<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="start-screen">
    <section class="start-content" aria-label="Nomi Start">
      <div class="start-flower" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <h1>Nomi</h1>
      <p class="subtitle">Breathing Meditation</p>

      <div class="control-block">
        <label for="duration"><span>Duration</span><span id="durationText">1 Minute</span></label>
        <input type="range" id="duration" min="1" max="10" value="1" step="1">
      </div>

      <div class="control-block">
        <label for="inhaleSeconds"><span>Inhale</span><span><span id="inhaleValue">4</span> Seconds</span></label>
        <input type="range" id="inhaleSeconds" min="4" max="8" value="4" step="0.5">
      </div>

      <div class="control-block">
        <label for="exhaleSeconds"><span>Exhale</span><span><span id="exhaleValue">6</span> Seconds</span></label>
        <input type="range" id="exhaleSeconds" min="4" max="8" value="6" step="0.5">
      </div>

      <div class="start-options" aria-label="Session Options">
        <label class="option-row"><span>Show Remaining Time</span><input id="showTimerStart" type="checkbox" checked></label>
        <label class="option-row"><span>Show Breathing Text</span><input id="showPhaseTextStart" type="checkbox" checked></label>
        <label class="option-row"><span>Enable Breathing Sound</span><input id="soundStart" type="checkbox" checked></label>
      </div>

      <button id="startButton" type="button">Start</button>
      <a id="shareLink" class="share-link" href="#">Share Nomi</a>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
